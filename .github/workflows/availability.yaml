name: Availability check

# Runs the checks a hostname-only uptime service cannot do:
# per-IP reachability, TLS expiry per IP, DNS drift, ACME TXT presence
# and build freshness. On failure it opens (or comments on) a GitHub
# Issue, which emails everyone watching the repo — free alerting with
# no extra service.
#
# NOTE ON TIMING: GitHub delays scheduled runs under load, sometimes by
# 10-30 minutes, and disables schedules after 60 days of repo inactivity.
# So this is the thorough-but-slow layer. Fast outage detection stays
# with UptimeRobot at 5-minute intervals.

on:
  schedule:
    - cron: '0 */2 * * *'      # every 2 hrs (best effort)
  workflow_dispatch:             # and on demand, from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run availability checks
        id: checks
        env:
          ONDC_DOMAIN: ${{ vars.ONDC_DOMAIN || 'ondc.org' }}
          # Set this repo variable once DNS is cut over, to the two A
          # records CloudCannon issued. Leaving it empty skips the
          # drift check and probes whatever is currently live.
          ONDC_EXPECTED_IPS: ${{ vars.ONDC_EXPECTED_IPS }}
          ONDC_KEYWORD: ${{ vars.ONDC_KEYWORD || 'Network Participants' }}
          ONDC_CERT_WARN_DAYS: ${{ vars.ONDC_CERT_WARN_DAYS || '21' }}
          ONDC_MAX_BUILD_AGE_HOURS: ${{ vars.ONDC_MAX_BUILD_AGE_HOURS || '168' }}
        run: |
          chmod +x scripts/monitoring/check-availability.sh
          set -o pipefail
          ./scripts/monitoring/check-availability.sh 2>&1 | tee /tmp/report.txt

      - name: Open or update alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Strip ANSI colour so the issue body is readable.
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/report.txt > /tmp/clean.txt
          BODY="Availability check failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          \`\`\`
          $(cat /tmp/clean.txt)
          \`\`\`

          [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          EXISTING=$(gh issue list --label availability --state open \
                      --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create availability --color B60205 \
              --description "Automated availability alerts" 2>/dev/null || true
            gh issue create --title "🔴 ondc.org availability check failed" \
              --label availability --body "$BODY"
          fi

      - name: Close alert issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --label availability --state open \
                      --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "✅ Recovered — all checks passed at $(date -u '+%Y-%m-%d %H:%M UTC')."
            gh issue close "$EXISTING"
          fi
