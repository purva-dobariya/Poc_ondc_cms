# ─────────────────────────────────────────────────────────────────────────────
# ONDC site — CloudCannon configuration
#
# The site is built with Eleventy. In CloudCannon, Site Settings → Build must be:
#     Site generator : Eleventy
#     Install command: npm install
#     Build command  : npx @11ty/eleventy --config=eleventy.config.js
#     Output path    : _site
#
# Every page is a file in src/pages with a `sections` list in its front matter.
# Editors add, duplicate, reorder and delete those sections; developers only get
# involved when a brand new KIND of section is needed.
# ─────────────────────────────────────────────────────────────────────────────

source: ''
paths:
  static: ''
  uploads: images
timezone: Asia/Calcutta
# Exposes src/_data/site.json to Bookshop's live rendering in the Visual Editor.
# Without this, components that read site.* render empty while editing.
data_config:
  site:
    path: src/_data/site.json               # ← exposes it to live rendering
markdown:
  engine: commonmark
  options: {}

collections_config:
  pages:
    path: src/pages
    url: /[slug].html
    glob:
      - '*.liquid'
    name: Pages
    singular_name: Page
    icon: wysiwyg
    description: Every page on the site. Open one to edit its text and images, or to add, duplicate, reorder and remove whole sections.
    create:
      path: '[relative_base_path]/{title|slugify}.liquid'
    # Schema files must NOT live in src/pages: CloudCannon treats a file used as a
    # schema as a template and hides it from the Pages list. Keep them in schemas/.
    schemas:
      blank:
        name: Blank page
        path: schemas/page.liquid
        icon: note_add
      landing:
        name: Landing page starter
        path: schemas/landing-page.liquid
        icon: article

  site:
    path: src/_data
    glob:
      - 'site.json'
    name: Header & Footer
    singular_name: Header & Footer
    icon: settings
    description: The logo, the top navigation and the footer. These appear on every page.
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - data

# ─────────────────────────────────────────────────────────────────────────────
# The section library: everything an editor can add to a page.
# ─────────────────────────────────────────────────────────────────────────────

_structures:
  # Small repeating pieces. The section library itself is generated by
  # Bookshop from component-library/components/*/*.bookshop.yml
  buttons:
    style: select
    values:
      - label: Button
        icon: smart_button
        value:
          label: Button text
          url: '#'
          style: primary
          new_tab: false
  bullets:
    style: select
    values:
      - label: Bullet
        icon: check
        value:
          text: ''
  link_columns:
    style: select
    values:
      - label: Link column
        icon: view_column
        value:
          heading: New column
          links: []
  links:
    style: select
    values:
      - label: Link
        icon: link
        value:
          label: ''
          url: ''
          new_tab: false
  social:
    style: select
    values:
      - label: Social link
        icon: share
        value:
          label: ''
          url: ''
          platform: linkedin
  figures:
    style: select
    values:
      - label: Number
        icon: pin
        value:
          value: '0'
          label: ''
          word_style: false
  # One row in the RFP / RFQ ledger. Three kinds, same fields: an open tender,
  # a closed one, and an empanelled agency. Which one you pick sets `tab`,
  # which decides the tab it appears under — and for the two tender kinds the
  # last date normally overrides it, so a tender closes itself on time.
  rfp_tenders:
    style: select
    values:
      - label: Open RFP / RFQ
        icon: gavel
        value:
          tab: open
          rfp_no: ''
          name: ''
          last_date: ''
          documents:
            - doc_type: RFP document
              file: ''
              url: ''
        _inputs: &rfp_tender_inputs
          tab:
            type: select
            label: Which tab it appears under
            comment: >-
              With "Move tenders automatically" on (the normal case), the last
              date decides Open vs Closed and this is only the starting point.
              Empanelled agencies always stay in their own tab.
            options:
              values:
                - value: open
                  label: Open
                - value: closed
                  label: Closed
                - value: empanelled
                  label: Empanelled agencies
          rfp_no:
            type: text
            label: RFP / RFQ number
            comment: The reference exactly as it should appear, for example ONDC/RFP/2026/001.
          name:
            type: text
            label: Name
          last_date:
            type: text
            label: Last date to apply
            comment: >-
              Day.Month.Year, for example 30.11.2026. Leave empty for an
              empanelled agency.
          documents:
            type: array
            label: Documents
            comment: >-
              The files applicants download — the RFP itself, any corrigendum,
              annexures. Use + to add one and drag to reorder.
            options:
              structures: _structures.rfp_documents
      - label: Closed RFP / RFQ
        icon: folder
        value:
          tab: closed
          rfp_no: ''
          name: ''
          last_date: ''
          documents:
            - doc_type: RFP document
              file: ''
              url: ''
        _inputs: *rfp_tender_inputs
      - label: Empanelled agency
        icon: verified
        value:
          tab: empanelled
          rfp_no: ''
          name: ''
          last_date: ''
          documents: []
        _inputs: *rfp_tender_inputs

  # One downloadable file attached to a row. Either uploaded here, or a link to
  # a file that already lives somewhere else (ONDC's S3, for instance).
  rfp_documents:
    style: select
    values:
      - label: Document
        icon: description
        value:
          doc_type: RFP document
          file: ''
          url: ''
        _inputs:
          doc_type:
            type: text
            label: What this document is
            comment: The wording shown as the download link, for example "RFP document" or "Corrigendum 1".
          file:
            type: file
            label: Upload the document
            comment: >-
              A PDF is normal. Leave this empty if the file is already online
              and you want to link to it instead.
            options:
              path: files/rfp
          url:
            type: url
            label: …or link to a file already online
            comment: >-
              Used only when nothing is uploaded above. Paste the full address,
              for example an existing link on ONDC's S3.

  # The three tabs above the table. Each lists what is assigned to it, and
  # shows its own message when it is empty.
  rfp_tabs:
    style: select
    values:
      - label: Tab — open tenders
        icon: folder_open
        value:
          key: open
          label: Open
          source: open
          empty_heading: No records found
          empty_body: Nothing matches this filter right now.
        _inputs: &rfp_tab_inputs
          label:
            type: text
            label: Tab name
          empty_heading:
            type: text
            label: Heading when this tab is empty
          empty_body:
            type: textarea
            label: Message when this tab is empty
          key:
            type: text
            hidden: true
          source:
            type: text
            hidden: true
      - label: Tab — closed tenders
        icon: folder
        value:
          key: closed
          label: Closed
          source: closed
          empty_heading: No records found
          empty_body: Nothing matches this filter right now.
        _inputs: *rfp_tab_inputs
      - label: Tab — empanelled agencies
        icon: verified
        value:
          key: empanelled
          label: Empanelled agencies
          source: empanelled
          empty_heading: No empanelled agencies yet
          empty_body: This list is empty for now. Check back after the next empanelment cycle.
        _inputs: *rfp_tab_inputs
_inputs:
  sections:
    type: array
    label: Page sections
    comment: The blocks this page is made of. Use + to add one, the ⋮ menu to duplicate or delete, and drag to reorder.
    options:
      structures: _structures.sections
      empty_type: array

  # --- page settings ---
  title:
    type: text
    label: Title
  details:
    type: textarea
    label: Description
  description:
    type: textarea
    label: Search engine description
    comment: One or two sentences. Shown in Google results and when the page is shared.
  permalink:
    type: text
    label: Page address
    comment: The address this page lives at, for example /contact.html — keep it unique.
  preload_image:
    type: image
    label: First image to load
    comment: Optional. The one large image at the very top of the page, loaded early so it appears faster.
  layout:
    type: text
    hidden: true

  # --- shared text ---
  heading:
    type: text
    label: Heading
  subtitle:
    type: text
    label: Sub heading
  eyebrow:
    type: text
    label: Small label above the heading
  intro:
    type: textarea
    label: Intro text
  tagline:
    type: textarea
    label: Closing line
  lead:
    type: textarea
    label: Summary
  body:
    type: html
    label: Text
    options:
      bold: true
      italic: true
      link: true
      bulletedlist: true
      numberedlist: true
      subheading: true
      removeformat: true
      undo: true
      redo: true
  text:
    type: html
    label: Text
    options:
      bold: true
      italic: true
      link: true
      removeformat: true
      undo: true
      redo: true
  subtext:
    type: textarea
    label: Supporting line
  note:
    type: textarea
    label: Note for editors
    comment: Only shown inside the CMS, never on the live site.
  caption:
    type: textarea
    label: Caption

  # --- layout choices ---
  background:
    type: select
    label: Background
    options:
      values:
        - light
        - white
        - tint
        - dark
  full_width:
    type: checkbox
    label: Use the full width
  columns:
    type: select
    label: Cards per row
    options:
      values:
        - 2
        - 3
        - 4
  anchor_id:
    type: text
    label: Link anchor
    comment: Lets menu links jump to this section, for example find-your-place. Change only if you know a link points here.

  # --- links and buttons ---
  buttons:
    type: array
    label: Buttons
    options:
      structures: _structures.buttons
  label:
    type: text
    label: Label
  url:
    type: url
    label: Link address
  link:
    type: url
    label: Link address
  link_url:
    type: url
    label: Link address
  link_label:
    type: text
    label: Link text
  cta_label:
    type: text
    label: Button text
  cta_url:
    type: url
    label: Button link
  post_link:
    type: url
    label: Link to the post
  new_tab:
    type: checkbox
    label: Open in a new tab
  style:
    type: select
    label: Button style
    options:
      values:
        - primary
        - secondary

  # --- pictures and video ---
  image:
    type: image
    label: Image
    comment: Upload a new picture or pick one already on the site. Use the crop tool to change the framing.
  poster:
    type: image
    label: Image
  logo:
    type: image
    label: Logo
  alt:
    type: text
    label: Image description
    comment: Describes the picture for screen readers and when the image cannot load.
  image_alt:
    type: text
    label: Image description
  media:
    type: object
    label: Picture or video
    comment: Choose a picture, upload a video file, or paste a YouTube / Vimeo link.
  kind:
    type: select
    label: What to show
    options:
      values:
        - value: image
          label: A picture
        - value: video_file
          label: A video file I upload
        - value: video_embed
          label: A YouTube or Vimeo link
  video:
    type: file
    label: Video file
    comment: An .mp4 works everywhere. Keep it under about 20 MB so the page stays fast.
  embed_url:
    type: url
    label: YouTube or Vimeo link
    comment: Paste the normal address of the video, for example https://www.youtube.com/watch?v=…

  # --- lists inside sections ---
  cards:
    type: array
    label: Cards
    comment: Use + to add a card, the ⋮ menu to duplicate or delete one, and drag to reorder.
  items:
    type: array
    label: Items
    comment: Use + to add, the ⋮ menu to duplicate or delete, and drag to reorder.
  slides:
    type: array
    label: Slides
    comment: Use + to add a slide, the ⋮ menu to duplicate or delete one, and drag to reorder.
  beats:
    type: array
    label: Story beats
    comment: Four beats work best. Each one fades in as the reader scrolls.
  bullets:
    type: array
    label: Bullet points
    options:
      structures: _structures.bullets
  points:
    type: array
    label: Bullet points
    options:
      structures: _structures.bullets
  figures:
    type: array
    label: Numbers
    options:
      structures: _structures.figures
  nav:
    type: array
    label: Menu
  children:
    type: array
    label: Drop-down links
  links:
    type: array
    label: Links
    comment: Use + to add a link, the item menu to duplicate or delete, and drag to reorder.
    options:
      structures: _structures.links
  link_columns:
    type: array
    label: Footer link columns
    comment: Each column has a heading and its own list of links.
    options:
      structures: _structures.link_columns
  social:
    type: array
    label: Social links
    options:
      structures: _structures.social
  use_site_settings:
    type: checkbox
    label: Use the shared footer from Site settings
    comment: Leave ticked so every page shows the same footer. Untick only to give this one page its own footer.
  background_image:
    type: image
    label: Footer background artwork
    comment: The wide illustration behind the footer. A long, low image works best (about 2400 x 900).


  # --- individual list fields ---
  line1:
    type: text
    label: First line
  line2:
    type: text
    label: Second line
  impact_line1:
    type: text
    label: Closing line 1
  impact_line2:
    type: text
    label: Closing line 2
  sub_line:
    type: text
    label: Line under the closing lines
  wordmark:
    type: text
    label: Wordmark
  pill:
    type: text
    label: Tab name
    comment: The short name shown in the row of buttons under the slide.
  sector:
    type: text
    label: Sector label
  badge:
    type: text
    label: Status badge
    comment: For example Live or Upcoming.
  value:
    type: text
    label: Number
  word_style:
    type: checkbox
    label: This is a word, not a number
    comment: Tick when the value is a word such as "Marine" so it is sized for text.
  name:
    type: text
    label: Name
  role:
    type: text
    label: Role and company
  quote:
    type: textarea
    label: Quote
    comment: The same words that appear on the poster. Used by screen readers.
  tag:
    type: text
    label: Small label on the picture
  image_tag:
    type: text
    label: Small label on the picture
  source:
    type: text
    label: Publication
    comment: The button reads "Read on …" followed by this.
  headline:
    type: text
    label: Headline
  dek:
    type: textarea
    label: Short summary
  coming_soon:
    type: checkbox
    label: Mark as coming soon
  show:
    type: checkbox
    label: Show this card
  more:
    type: object
    label: Last card ("View more")
  footer:
    type: object
    label: Footer
  platform:
    type: select
    label: Network
    options:
      values:
        - linkedin
        - instagram
        - youtube
        - facebook
        - x
  blurb:
    type: textarea
    label: Footer blurb
  copyright:
    type: text
    label: Copyright line
  logo_alt:
    type: text
    label: Logo description
  home_url:
    type: text
    label: Address of the home page
    comment: >-
      Where the logo links to, and what menu items that point at a spot on the
      home page (those starting with #) are prefixed with when viewed from any
      other page. Change this only if the home page moves.

  # --- fields used by the page-archetype components (About and later pages) ---
  heading_accent:
    type: text
    label: Highlighted tail of the heading
    comment: Shown in the accent style at the end of the heading. Leave empty for a plain heading.
  screen_label:
    type: text
    label: Section name for screen readers
    comment: Optional. Describes this section to assistive technology.
  paragraphs:
    type: array
    label: Paragraphs
    comment: Use + to add a paragraph, the item menu to duplicate or delete, and drag to reorder.
  groups:
    type: array
    label: Groups
    comment: Each group has a heading and its own numbered list. Numbering is automatic.
  rows:
    type: array
    label: Organisations
  people:
    type: array
    label: People
    comment: Use + to add a person, the item menu to duplicate or delete, and drag to reorder.
  photo:
    type: image
    label: Photo
    comment: A square portrait works best.
  org:
    type: text
    label: Organisation
  logos:
    type: object
    label: Logo strip
  count:
    type: text
    label: Number
    comment: Counts up as the reader scrolls into view.
  count_label:
    type: text
    label: What the number counts
  featured:
    type: object
    label: Featured item
  awards:
    type: array
    label: Awards
  years:
    type: array
    label: Years
    comment: Use + to add a year, the item menu to duplicate or delete, and drag to reorder.
  year:
    type: text
    label: Year
  entries:
    type: array
    label: Entries
  meta:
    type: text
    label: Date or label
  is_milestone:
    type: checkbox
    label: Show as a highlighted milestone
  milestone_title:
    type: text
    label: Milestone headline
    comment: Used when the milestone has no number.
  milestone_number:
    type: text
    label: Milestone number
    comment: Optional. Shown large, and counts up. Leave empty to use the headline instead.
  milestone_suffix:
    type: text
    label: Milestone number suffix
    comment: For example M+ or %.
  finale:
    type: object
    label: Closing figure
  number:
    type: text
    label: Number
  suffix:
    type: text
    label: Suffix
  action:
    type: select
    label: What this button does
    options:
      values:
        - value: link
          label: Go to a link
        - value: signup
          label: Open the ONDC sign-up portal
  sectors:
    type: object
    label: Sector links

  # --- fields used by the role / directory pages (RFPs, Gateway, Buyer NP …) ---
  variant:
    type: select
    label: Layout
    comment: >-
      "Plain" is the wide band used at the bottom of the About page. "Panel" is
      the white rounded card used at the bottom of the role pages — it is the
      one that can also carry a paragraph.
    options:
      values:
        - value: ''
          label: Plain
        - value: role
          label: Panel
  heading_suffix:
    type: text
    label: Text after the highlighted part
    comment: >-
      Usually just a full stop. The heading reads "Unlock business
      opportunities." — "opportunities" is the highlighted part and "." is this.
  copy:
    type: textarea
    label: Intro paragraph
  tally:
    type: object
    label: Counter on the right
  source_note:
    type: text
    label: Where the number comes from
    comment: The small grey line under the counter, for example "Refreshed from the live tender feed".
  aria_label:
    type: text
    label: Section description for screen readers

# Toolbar for the click-to-edit regions in the visual editor.
_editables:
  content:
    format: p h2 h3 h4
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    removeformat: true
    undo: true
    redo: true
  block:
    format: p h3 h4
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    removeformat: true
  text:
    bold: true
    italic: true
    link: true
    removeformat: true

