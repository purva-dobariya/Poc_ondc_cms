paths:
  static: ''
  uploads: images
timezone: Asia/Calcutta
markdown:
  engine: commonmark
  options: {}
collections_config:
  pages:
    path: ''
    icon: wysiwyg

  # Content that is shown as repeatable cards. One file per card group.
  # Editors: sidebar > Data > News cards > "Add item" / duplicate / drag / delete.
  data:
    path: data
    name: Data
    icon: view_carousel
    _enabled_editors:
      - data
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true

    _inputs:
      cards:
        type: array
        label: News cards
        comment: >-
          Each item is one card in "ONDC in the News". Use "Add item" for a new
          card, the item menu to duplicate or delete, and drag to reorder.
          The numbers 01, 02, 03... are added automatically.
        options:
          structures: _structures.news_card
      image:
        type: image
        label: Card image
        comment: Upload or pick a picture. It is cropped to 16:10 automatically.
        options:
          resize_style: cover
          width: 1200
          height: 750
      tag:
        type: text
        label: Category label
        comment: Small pill on the image, e.g. Logistics
      source:
        type: text
        label: Publication
        comment: e.g. Inc42. The button reads "Read on <publication>".
      headline:
        type: text
        label: Headline
      dek:
        type: textarea
        label: Short summary
      link:
        type: url
        label: Article link
        comment: Full address of the article, starting with https://

      stories:
        type: array
        label: Network stories
        comment: >-
          Each item is one poster in "The Network in Action". Use "Add item" for
          a new story, the item menu to duplicate or delete, and drag to reorder.
          Three fit on one row; more wrap onto the next row (a swipeable rail on phones).
        options:
          structures: _structures.story_card
      poster:
        type: image
        label: Poster image
        comment: The LinkedIn post / quote graphic. Portrait 4:5 works best (e.g. 1080 x 1350).
        options:
          resize_style: cover
          width: 1080
          height: 1350
      name:
        type: text
        label: Person's name
        comment: Read out by screen readers only.
      role:
        type: text
        label: Role and company
        comment: e.g. Founder, SukeshKart. Read out by screen readers only.
      quote:
        type: textarea
        label: Quote shown in the poster
        comment: Same words as the poster image. Read out by screen readers only.
      badge:
        type: text
        label: Label under the poster
        comment: e.g. Seller Story
      post_link:
        type: url
        label: Post link
        comment: Address of the LinkedIn post, starting with https://

    _structures:
      news_card:
        style: select
        values:
          - label: News card
            icon: newspaper
            preview:
              text:
                - key: headline
              subtext:
                - key: source
              image:
                - key: image
            value:
              image: ''
              tag: ''
              source: ''
              headline: ''
              dek: ''
              link: ''
      story_card:
        style: select
        values:
          - label: Network story
            icon: format_quote
            preview:
              text:
                - key: name
              subtext:
                - key: role
              image:
                - key: poster
            value:
              poster: ''
              name: ''
              role: ''
              quote: ''
              badge: Seller Story
              post_link: ''

# Toolbar for every data-editable="source" region (home.html has ~83 of them).
# `format` limits which block types editors can switch to, so they stay on-design.
_editables:
  content:
    format: p h1 h2 h3 h4
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    image: true
    removeformat: true
    undo: true
    redo: true
