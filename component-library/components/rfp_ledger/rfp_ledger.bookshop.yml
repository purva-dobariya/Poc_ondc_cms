spec:
  structures: [sections]
  label: RFP / RFQ ledger
  description: >-
    The tender table. Add an open RFP, a closed one, or an empanelled agency —
    each takes a number, a name, a last date and its documents, which you
    either upload or link to. Open and Closed sort themselves out by date.
  icon: table_rows

blueprint:
  screen_label: The ledger
  anchor_id: rfp-ledger
  heading_id: ''
  eyebrow: The ledger
  heading: Every opportunity,
  heading_accent: on the record
  heading_suffix: '.'
  tally_id: ''
  auto_by_date: true
  show_search: true
  search_placeholder: Search by RFP name or number
  search_label: ''
  tabs_label: Categories
  due_label: Last date to apply
  tabs:
    - key: open
      label: Open
      source: open
      empty_heading: No records found
      empty_body: Nothing matches this filter right now.
    - key: closed
      label: Closed
      source: closed
      empty_heading: No records found
      empty_body: Nothing matches this filter right now.
    - key: empanelled
      label: Empanelled agencies
      source: empanelled
      empty_heading: No empanelled agencies yet
      empty_body: This list is empty for now. Check back after the next empanelment cycle.
  tenders: []

_inputs:
  tenders:
    type: array
    label: RFPs, RFQs and empanelled agencies
    comment: >-
      Everything the table lists. Use + to add one — you choose whether it is an
      open RFP, a closed one, or an empanelled agency. Drag to reorder.
    options:
      structures: _structures.rfp_tenders
  auto_by_date:
    type: checkbox
    label: Move tenders between Open and Closed automatically
    comment: >-
      Leave this on. A tender then sits under Open until the end of its last
      date and appears under Closed from the next day, with no rebuild needed.
      Turn it off only if you want to decide each tender's tab by hand.
      Empanelled agencies are never moved either way.
  tally_id:
    type: text
    hidden: true
  heading_id:
    type: text
    hidden: true
  show_search:
    type: checkbox
    label: Show the search box
  search_placeholder:
    type: text
    label: Search box placeholder
  search_label:
    type: text
    label: Search box description for screen readers
    comment: Optional. Falls back to the placeholder text.
  tabs_label:
    type: text
    label: Name of the tab row for screen readers
  due_label:
    type: text
    label: Wording under each last date
  tabs:
    type: array
    label: Tabs
    comment: >-
      The three tabs above the table. The first one is open when the page
      loads. You will rarely need to change these.
    options:
      structures: _structures.rfp_tabs
