spec:
  structures: [sections]
  label: Closing call to action
  description: >-
    A short closing heading with buttons, at the end of a page above the footer.
    Two layouts: "Plain" is the wide band used on the About page, "Panel" is the
    white rounded card used on the role pages — Panel can also carry a paragraph.
  icon: flag

blueprint:
  screen_label: ''
  variant: ''
  anchor_id: ''
  heading_id: ''
  heading: A closing line for this page
  heading_accent: ''
  heading_suffix: ''
  body: ''
  buttons:
    - label: Get started
      url: 'https://portal.ondc.org/'
      style: solid
      new_tab: true
      action: link

_inputs:
  heading_id:
    type: text
    hidden: true
  body:
    type: textarea
    label: Paragraph
    comment: Only shown by the "Panel" layout. Leave empty for just a heading and buttons.
