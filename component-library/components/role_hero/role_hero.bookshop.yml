spec:
  structures: [sections]
  label: Role page hero
  description: >-
    The opening band on a role or directory page — a big heading, one paragraph,
    buttons, and an optional live counter on the right. Used by RFPs/RFQs,
    Gateway, Network Participants and the Buyer/Seller/TSP pages.
  icon: campaign

blueprint:
  screen_label: Hero
  anchor_id: ''
  heading_id: ''
  heading: A heading for this page
  heading_accent: ''
  heading_suffix: ''
  copy: One paragraph introducing what this page is for.
  buttons:
    - label: Sign up
      url: ''
      style: ghost
      new_tab: false
      action: signup
  tally:
    show: false
    value_id: ''
    aria_label: ''
    placeholder: '—'
    label: What this number counts.
    source_note: ''

_inputs:
  copy:
    type: textarea
    label: Intro paragraph
  heading_id:
    type: hidden
  tally:
    type: object
    label: Counter on the right
    comment: >-
      The large number beside the heading. Its value is filled in by the page
      itself from live data — the text around it is edited here.
    options:
      preview:
        text:
          - key: label
  show:
    type: checkbox
    label: Show the counter
  placeholder:
    type: text
    label: Shown until the number loads
    comment: A dash works well. Visitors see this for a moment on a slow connection.
  value_id:
    type: hidden
